<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen Rutas Supermercados · Rinze Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0E17'/%3E%3Cpath d='M10 24V8h7a4.5 4.5 0 0 1 0 9h-7M16 17l6 7' fill='none' stroke='%2300FF88' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FF88"/><stop offset="1" stop-color="#00D2FE"/></linearGradient></defs>
</svg>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
      <rect x="1" y="1" width="38" height="38" rx="10" fill="#0A0E17" stroke="#253248"/>
      <path d="M13 30V10h8.5a5.5 5.5 0 0 1 0 11H13M20 21l7 9" fill="none" stroke="url(#gr)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="13" cy="10" r="2.6" fill="#0A0E17" stroke="#00FF88" stroke-width="2"/>
      <circle cx="13" cy="30" r="2.6" fill="#0A0E17" stroke="#00FF88" stroke-width="2"/>
      <circle cx="27" cy="30" r="2.6" fill="#0A0E17" stroke="#00D2FE" stroke-width="2"/>
    </svg>
    <div class="wm"><b>Rinze</b><span>STUDIO</span></div>
  </div>
  <div class="sep"></div>
  <div class="app-name">Resumen Rutas Supermercados</div>
  <nav class="tabs" aria-label="Módulos">
    <button type="button" data-tab="resumen" class="on">Resumen</button>
    <button type="button" data-tab="cadenas">Cadenas</button>
    <button type="button" data-tab="cambios">Cambios</button>
    <button type="button" data-tab="verif">Verificación</button>
    <button type="button" data-tab="hist">Historial</button>
    <button type="button" data-tab="config">Configuración</button>
  </nav>
  <div class="top-acts">
    <button type="button" class="btn ghost" id="btnReiniciar" title="Quitar los archivos cargados">
      <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Empezar de nuevo
    </button>
    <span class="ver" id="ver"></span>
  </div>
</header>

<main id="app">
  <section class="view on" id="v-resumen"></section>
  <section class="view" id="v-cadenas"></section>
  <section class="view" id="v-cambios"></section>
  <section class="view" id="v-verif"></section>
  <section class="view" id="v-hist"></section>
  <section class="view" id="v-config"></section>
</main>

<input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" multiple hidden>
<input type="file" id="cfgInput" accept=".json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/imagen.js"></script>
<script src="js/carpetas.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
