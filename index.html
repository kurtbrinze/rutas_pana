<!doctype html>
<html lang="es">
<head>

<meta name="apple-mobile-web-app-title" content="Rutas Súper">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Resumen AM/PM de rutas de supermercados · Rinze Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>(function(){var h=document.documentElement,t='oscuro';try{if(top!==self)h.classList.add('rz-en-centro')}catch(_){h.classList.add('rz-en-centro')}try{t=localStorage.getItem('rz.tema')||t}catch(_){}try{if(top!==self)t=top.localStorage.getItem('rz.tema')||t}catch(_){}function ap(x){h.setAttribute('data-tema',x);var m=document.querySelectorAll('style[data-rz-tema]');for(var i=0;i<m.length;i++)m[i].media=m[i].getAttribute('data-rz-tema')===x?'screen':'not all';var f=document.querySelectorAll('iframe');for(var j=0;j<f.length;j++){try{f[j].contentWindow.postMessage({tipo:'cc:tema',tema:x},'*')}catch(_){}}}window.rzTema=ap;ap(t);document.addEventListener('DOMContentLoaded',function(){ap(h.getAttribute('data-tema'))});addEventListener('message',function(e){if(e.data&&e.data.tipo==='cc:tema'&&(e.data.tema==='claro'||e.data.tema==='oscuro')){try{localStorage.setItem('rz.tema',e.data.tema)}catch(_){}ap(e.data.tema)}})})();</script>
<link rel="stylesheet" href="https://centrocontrolpana.vercel.app/tema/rinze-tema.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--rz-logo-2,#9CA3AF)"/><stop offset="1" style="stop-color:var(--rz-logo-2,#9CA3AF)"/></linearGradient></defs>
</svg>

<header class="top">
  <div class="brand rz-solo-fuera">
    <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
      <rect x="1" y="1" width="38" height="38" rx="10" fill="var(--rz-bg,#0D0F12)" stroke="var(--rz-card-borde,#262A32)"/>
      <path d="M13 30V10h8.5a5.5 5.5 0 0 1 0 11H13M20 21l7 9" fill="none" stroke="url(#gr)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="13" cy="10" r="2.6" fill="var(--rz-bg,#0D0F12)" stroke="var(--rz-logo-2,#9CA3AF)" stroke-width="2"/>
      <circle cx="13" cy="30" r="2.6" fill="var(--rz-bg,#0D0F12)" stroke="var(--rz-logo-2,#9CA3AF)" stroke-width="2"/>
      <circle cx="27" cy="30" r="2.6" fill="var(--rz-bg,#0D0F12)" stroke="var(--rz-logo-2,#9CA3AF)" stroke-width="2"/>
    </svg>
    <div class="wm"><b>Rinze</b><span>STUDIO</span></div>
  </div>
  <div class="sep rz-solo-fuera"></div>
  <div class="app-name rz-solo-fuera"><img src="icons/icon.svg" alt="" width="26" height="26">Resumen Rutas Supermercados</div>
  <nav class="tabs" aria-label="Módulos">
    <button type="button" data-tab="resumen" class="on">Resumen</button>
    <button type="button" data-tab="cadenas">Cadenas</button>
    <button type="button" data-tab="cambios">Cambios</button>
    <button type="button" data-tab="verif">Verificación</button>
    <button type="button" data-tab="hist">Historial</button>
    <button type="button" data-tab="config">Configuración</button>
  </nav>
  <div class="top-acts">
    <button type="button" class="btn ghost" id="btnInstalar" hidden title="Instalar como aplicación en esta PC">
      <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="m9 9 3 3 3-3M12 6v6"/></svg>
      Instalar app
    </button>
    <button type="button" class="btn ghost" id="btnReiniciar" title="Quitar los archivos cargados">
      <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Empezar de nuevo
    </button>
    <span class="ver rz-solo-fuera" id="ver"></span>
  </div>
</header>

<main id="app">
  <section class="view on" id="v-resumen"></section>
  <section class="view" id="v-cadenas"></section>
  <section class="view" id="v-cambios"></section>
  <section class="view" id="v-verif"></section>
  <section class="view" id="v-hist"></section>
  <section class="view" id="v-config"></section>
</main>

<input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" multiple hidden>
<input type="file" id="cfgInput" accept=".json" hidden>
<input type="file" id="histInput" accept=".xlsx,.xls,.xlsm" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/imagen.js"></script>
<script src="js/carpetas.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
